<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <!-- Bu etiket dış sitelerin "kimden geliyor bu istek" kontrolünü kör eder -->
    <meta name="referrer" content="no-referrer">
    <title>Dizi Sitem</title>
    <style>
        body {
            background-color: #141414;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px; oynatici
        }
        input {
            width: 500px;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #333;
            border-radius: 5px;
            background-color: #222;
            color: white;
        }
        button {
            padding: 12px 25px;
            font-size: 16px;
            background-color: #e50914;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .video-alani {
            margin-top: 30px;
        }
    </style>
</head>
<body>

    <h1>Dizi İzleme Platformum</h1>
    <p>Oynatıcı linkini veya adresini aşağıya yapıştır:</p>

    <input type="text" id="diziUrl" placeholder="Link buraya...">
    <button type="button" onclick="diziAc()">BÖLÜMÜ AÇ</button>

    <div class="video-alani">
        <!-- İzinlerin hepsi full açıldı -->
        <iframe id="oynatici" width="800" height="450" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
    </div>

    <script>
        function diziAc() {
            var adres = document.getElementById("diziUrl").value.trim();
            if (adres !== "") {
                document.getElementById("oynatici").src = adres;
            } else {
                alert("Lütfen bir bağlantı yapıştır!");
            }
        }
    </script>

</body>
</html>
